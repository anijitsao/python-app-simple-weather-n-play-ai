[project]
name = "python-app-simple-weather-n-play-ai"
version = "0.1.0"
description = "Weather and play Agentic AI app"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi[standard]>=0.141.1",
    "openai-agents>=0.23.1",
    "pymupdf>=2.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "requests>=2.34.2",
    "semantic-text-splitter>=0.33.0",
]

[tool.pytest.ini_options]
# -s for using print() in test cases
# -q for quiet mode
# -ra to add short summary at the end
addopts = "-ra -s -q --cov=. --cov-report=html --cov-report=term"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:.*CallSpec2.*:pytest.PytestRemovedIn10Warning",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "venv/*", "setup.py"]

[tool.coverage.html]
directory = "coverage"


[tool.ruff.lint]
extend-ignore = ["BLE001"]

[tool.pyright]
exclude = ["**/node_modules", "**/__pycache__", "**/venv", "**/.venv"]
ignore = ["**/__pycache__", "**/venv", "**/.venv"]


# Suppress warnings about unknown or missing return types / Any types
reportUnknownParameterType = false
reportMissingParameterType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportAny = false
reportOptionalSubscript = false
reportArgumentType = false
